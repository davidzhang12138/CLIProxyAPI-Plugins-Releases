name: sync-private-tags
run-name: sync private tags

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional private source tag to publish immediately
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: sync-private-tags
  cancel-in-progress: false

env:
  SOURCE_REPO: davidzhang12138/CLIProxyAPI-Plugins
  MINIMUM_AUTOMATIC_TAG: v0.2.0

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch private source tags
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Select unpublished tags
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          published_tags="$(GH_TOKEN="$SOURCE_TOKEN" gh api --paginate "repos/${SOURCE_REPO}/releases" --jq '.[].tag_name')"

          is_published() {
            grep -Fxq -- "$1" <<< "$published_tags"
          }

          release_is_active() {
            local candidate="$1"
            local active
            active="$(gh run list \
              --repo "$RELEASE_REPO" \
              --limit 50 \
              --json displayTitle,status,databaseId \
              --jq ".[] | select(.displayTitle == \"release ${candidate}\" and (.status == \"queued\" or .status == \"in_progress\")) | .databaseId")"
            [[ -n "$active" ]]
          }

          tags=()
          requested="${REQUESTED_TAG//[[:space:]]/}"
          if [[ -n "$requested" ]]; then
            if [[ ! "$requested" =~ ^v[0-9] ]]; then
              echo "Invalid tag: $requested" >&2
              exit 1
            fi
            git rev-parse --verify --quiet "refs/tags/${requested}^{commit}" >/dev/null
            if release_is_active "$requested"; then
              echo "Release $requested is already running"
            else
              tags+=("$requested")
            fi
          else
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              newest="$(printf '%s\n%s\n' "$MINIMUM_AUTOMATIC_TAG" "$candidate" | sort -V | tail -n 1)"
              if [[ "$newest" != "$candidate" ]]; then
                continue
              fi
              if is_published "$candidate"; then
                continue
              fi
              if release_is_active "$candidate"; then
                echo "Release $candidate is already running, skipping"
                continue
              fi
              tags+=("$candidate")
            done < <(git tag --list 'v*' --sort=-version:refname)
          fi

          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "No unpublished tags found"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Selected: ${tags[*]}"
          {
            echo 'dispatch=true'
            echo "tags=$(printf '%s\n' "${tags[@]}" | jq -R . | jq -sc .)"
          } >> "$GITHUB_OUTPUT"
          printf 'Selected for public release: `%s`\n' "${tags[*]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch public releases
        if: steps.select.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.select.outputs.tags }}
        run: |
          set -euo pipefail
          jq -er '.[]' <<< "$TAGS" |
            while IFS= read -r tag; do
              echo "Dispatching release for $tag"
              gh workflow run release.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f "tag=$tag"
            done
